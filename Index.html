<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nhập pass nha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ffd1dc; --bg2:#ffe6ec; --bg3:#ffc2d1;
  --card:rgba(255,255,255,.78); --key:#fff; --text:#5a2a3c;
  --pink:#ff4d79; --pink-soft:#ffb3c6; --dot:#ffd9e2;
  --shadow:rgba(255,77,121,.22);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#3a1a28; --bg2:#4a2234; --bg3:#2d1220;
    --card:rgba(70,30,48,.75); --key:#5a2a3f; --text:#ffe3ec;
    --pink:#ff7a9c; --pink-soft:#a8506a; --dot:#6a2f47;
    --shadow:rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg1:#3a1a28; --bg2:#4a2234; --bg3:#2d1220;
  --card:rgba(70,30,48,.75); --key:#5a2a3f; --text:#ffe3ec;
  --pink:#ff7a9c; --pink-soft:#a8506a; --dot:#6a2f47;
  --shadow:rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3),var(--bg2));
  background-size:300% 300%;
  animation:bgShift 14s ease-in-out infinite;
  color:var(--text);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}
@keyframes bgShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}

.card{
  position:relative;z-index:2;
  width:min(380px,92vw);
  padding:34px 30px 38px;
  border-radius:44px;
  background:var(--card);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 30px 70px var(--shadow),0 0 0 1.5px rgba(255,255,255,.5) inset;
  text-align:center;
  animation:cardIn .9s cubic-bezier(.2,1.3,.4,1) both, float 6s ease-in-out .9s infinite;
}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.9)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.card.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px) rotate(-1.5deg)}40%{transform:translateX(12px) rotate(1.5deg)}60%{transform:translateX(-8px)}80%{transform:translateX(6px)}}

h1{
  margin:0 0 6px;font-size:2.3rem;font-weight:800;line-height:1.1;
  color:var(--pink);text-shadow:0 4px 14px var(--shadow);
}
h1 span{display:inline-block;animation:wave 2.4s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.hint{margin:0 0 20px;font-size:.95rem;opacity:.7;min-height:1.4em;transition:color .3s}
.hint.err{color:var(--pink);opacity:1}

.dots{display:flex;gap:16px;justify-content:center;margin-bottom:26px}
.dot{
  width:28px;height:28px;border-radius:50%;
  background:var(--dot);border:2.5px solid var(--pink-soft);
  display:grid;place-items:center;transition:background .25s,border-color .25s;
}
.dot::after{content:"♥";font-size:16px;color:#fff;transform:scale(0);transition:transform .35s cubic-bezier(.3,2,.5,1)}
.dot.on{background:var(--pink);border-color:var(--pink)}
.dot.on::after{transform:scale(1)}
.dot.on{animation:pop .4s cubic-bezier(.3,2,.5,1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.3)}100%{transform:scale(1)}}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 14px;justify-items:center}
.key{
  position:relative;overflow:hidden;
  width:100%;max-width:100px;height:78px;border-radius:26px;border:1.5px solid rgba(255,179,198,.5);
  background:var(--key);color:var(--text);
  font:600 1.9rem/1 "Baloo 2",system-ui,sans-serif;cursor:pointer;
  box-shadow:0 10px 22px var(--shadow);
  transition:transform .15s cubic-bezier(.3,2,.5,1),box-shadow .15s;
}
.key:hover{transform:translateY(-4px) scale(1.05);box-shadow:0 16px 28px var(--shadow)}
.key:active{transform:scale(.88)}
.key:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.key.del{color:var(--pink);font-size:1.6rem}
.key.empty{visibility:hidden}
.ripple{
  position:absolute;border-radius:50%;background:rgba(255,77,121,.35);
  transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none;
}
@keyframes rip{to{transform:scale(4);opacity:0}}

.music{
  position:fixed;left:max(20px,env(safe-area-inset-left,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:10;
  display:flex;align-items:center;gap:12px;padding:12px 24px 12px 16px;
  border-radius:999px;border:none;cursor:pointer;
  background:var(--card);color:var(--text);
  font:700 1rem "Baloo 2",system-ui,sans-serif;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 12px 28px var(--shadow);transition:transform .2s;
}
.music:hover{transform:scale(1.06)}
.music:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.music .heart{font-size:2rem;color:var(--pink);animation:beat 1.6s ease-in-out infinite;display:inline-block}
.music.playing .heart{animation-duration:.7s}
.music .eq{display:none;gap:3px;align-items:flex-end;height:18px}
.music.playing .eq{display:flex}
.eq i{width:4px;background:var(--pink);border-radius:2px;animation:eq 0.8s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:4px}50%{height:18px}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}

.unlocked{
  position:fixed;inset:0;z-index:5;display:grid;place-items:center;text-align:center;
  background:radial-gradient(circle,var(--bg2),var(--bg1));
  opacity:0;pointer-events:none;transition:opacity .8s;
}
.unlocked.show{opacity:1;pointer-events:auto}
.unlocked .big{font-size:5rem;animation:beat 1.2s infinite;color:var(--pink)}
.unlocked h2{margin:8px 0 4px;font-size:2.2rem;color:var(--pink)}
.unlocked p{margin:0;opacity:.8}
.stage{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.photos{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.photo{position:absolute;bottom:-190px;padding:6px 6px 22px;background:#fff;border-radius:6px;box-shadow:0 10px 24px var(--shadow);animation:rise linear forwards;will-change:transform}
.photo img{width:100%;aspect-ratio:1;object-fit:cover;display:block;border-radius:3px}
@keyframes rise{0%{transform:translate(0,0) rotate(var(--r));opacity:0}10%{opacity:1}50%{transform:translate(var(--sw),-55vh) rotate(calc(var(--r) * -1))}90%{opacity:1}100%{transform:translate(calc(var(--sw) * -1),-125vh) rotate(var(--r));opacity:0}}
.tools{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:10;display:flex;gap:10px}
.tool{padding:12px 18px;border-radius:999px;cursor:pointer;background:var(--card);color:var(--text);font:700 .95rem "Baloo 2",system-ui,sans-serif;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 12px 28px var(--shadow);transition:transform .2s}
.tool:hover{transform:scale(1.06)}
.tool:focus-within{outline:3px solid var(--pink);outline-offset:3px}
@media (max-width:620px){.tools{flex-direction:column;align-items:flex-end;bottom:max(84px,env(safe-area-inset-bottom,0px))}}
#three{width:min(92vw,560px);height:min(64vh,560px);touch-action:none;cursor:grab;filter:drop-shadow(0 24px 30px var(--shadow))}
#three:active{cursor:grabbing}
#three canvas{display:block;width:100%;height:100%}
.unlocked .tap{font-size:1.3rem;font-weight:600;opacity:.85;animation:tapPulse 2.2s ease-in-out infinite}
@keyframes tapPulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.06);opacity:1}}

/* Thiệp thư tình 3D */
.letter{position:fixed;inset:0;z-index:8;display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .6s,visibility .6s;overflow:hidden}
.letter.show{opacity:1;visibility:visible}
.letter-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(255,214,225,.55),rgba(90,30,55,.78));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.scene{position:relative;display:grid;place-items:center;width:100%;height:100%}
.scene>*{grid-area:1/1}
.env{position:relative;width:min(86vw,400px);height:min(56vw,260px);perspective:900px;opacity:0;transform:rotateX(14deg) rotateY(-10deg)}
.letter.show .env{animation:envIn 1.1s cubic-bezier(.2,1.2,.4,1) forwards}
.letter.show .env.gone{animation:envOut .9s ease forwards}
@keyframes envIn{from{opacity:0;transform:translateY(-120px) rotateX(50deg) rotateY(-30deg) scale(.6)}to{opacity:1;transform:translateY(0) rotateX(14deg) rotateY(-10deg) scale(1)}}
@keyframes envOut{from{opacity:1;transform:rotateX(14deg) rotateY(-10deg)}to{opacity:0;transform:translateY(90px) rotateX(40deg) scale(.8)}}
.env-back{position:absolute;inset:0;border-radius:12px;background:linear-gradient(160deg,#ffc9d6,#ffa9bf);box-shadow:0 30px 50px rgba(90,20,50,.45)}
.env .paper{position:absolute;left:6%;top:5%;width:88%;height:90%;border-radius:8px;z-index:2;background:repeating-linear-gradient(#fffaf2 0 22px,#f6e6d6 22px 23px);transition:transform 1.1s cubic-bezier(.3,1.1,.3,1)}
.env.rise .paper{transform:translateY(-64%)}
.env-front{position:absolute;inset:0;z-index:3;border-radius:12px;background:linear-gradient(180deg,#ffb7c9,#ff9db6);clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%)}
.flap{position:absolute;left:0;top:0;width:100%;height:55%;z-index:4;transform-origin:top center;background:linear-gradient(180deg,#ff9db6,#ff8fab);clip-path:polygon(0 0,100% 0,50% 100%);border-radius:12px 12px 0 0;transition:transform .9s cubic-bezier(.4,0,.2,1),z-index 0s .4s}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.seal{position:absolute;left:50%;top:55%;z-index:5;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff6b8e,#b3123f);color:#fff;display:grid;place-items:center;font-size:18px;box-shadow:0 4px 10px rgba(0,0,0,.35);transition:opacity .3s,transform .4s}
.env.open .seal{opacity:0;transform:scale(.4)}
.card-wrap{opacity:0;pointer-events:none;transform:perspective(1200px) translateY(140px) rotateX(60deg) scale(.55);transition:opacity .9s,transform 1.3s cubic-bezier(.2,1.15,.3,1)}
.card-wrap.show{opacity:1;pointer-events:auto;transform:perspective(1200px) translateY(0) rotateX(0deg) scale(1);animation:cfloat 5s ease-in-out 1.4s infinite}
@keyframes cfloat{0%,100%{translate:0 0}50%{translate:0 -9px}}
.card3d{position:relative;width:min(90vw,440px);max-height:84vh;overflow-y:auto;padding:clamp(30px,6vw,46px) clamp(24px,5vw,38px);border-radius:18px;text-align:center;color:#7a2c47;background:radial-gradient(circle at 20% 12%,#fffdf8,#fff1df 75%);border:2px solid #e3a99a;outline:1.5px solid #e3a99a;outline-offset:-12px;box-shadow:7px 9px 0 -1px #ffd1dc,14px 18px 0 -3px #ffb3c6,0 40px 80px rgba(60,10,35,.55);transform:perspective(1100px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s;font-family:"Dancing Script","Baloo 2",cursive,sans-serif}
.card3d::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,25%),rgba(255,255,255,.55),transparent 45%)}
.card3d h3{margin:0;font-size:clamp(3rem,13vw,4.2rem);font-weight:700;color:#ff4d79;line-height:1;text-shadow:0 3px 10px rgba(255,77,121,.25)}
.card3d .orn{margin:10px 0 18px;color:#d9a08f;letter-spacing:.5em;font-size:1.1rem}
.card3d p{margin:0 0 14px;font-size:clamp(1.35rem,5vw,1.7rem);line-height:1.45;font-weight:500}
.card3d .sign{font-size:clamp(1.9rem,7vw,2.5rem);font-weight:700;color:#ff4d79;margin:22px 0 0}
.card3d .sign i{font-style:normal;display:inline-block;animation:beat 1.4s infinite}
.line{opacity:0;transform:translateY(12px);filter:blur(5px)}
.card-wrap.show .line{animation:lineIn 1s ease forwards;animation-delay:var(--d,0s)}
@keyframes lineIn{to{opacity:1;transform:none;filter:none}}
.corner{position:absolute;color:#e3a99a;font-size:1.3rem;line-height:1}
.corner.tl{top:16px;left:18px}.corner.tr{top:16px;right:18px}.corner.bl{bottom:16px;left:18px}.corner.br{bottom:16px;right:18px}
.spark{position:absolute;color:#ffc94d;font-size:14px;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
.close{position:absolute;top:max(16px,env(safe-area-inset-top,0px));right:16px;z-index:3;padding:10px 20px;border:none;border-radius:999px;cursor:pointer;background:var(--card);color:var(--text);font:700 1rem "Baloo 2",system-ui,sans-serif;box-shadow:0 10px 24px var(--shadow)}
.close:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
@media (max-width:420px){.key{height:68px;font-size:1.6rem}h1{font-size:2rem}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<main class="card" id="card">
  <h1 id="title" aria-label="Nhập pass nha"></h1>
  <p class="hint" id="hint" role="status">Gõ 4 số để mở khóa</p>
  <div class="dots" id="dots" aria-hidden="true"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="pad" id="pad"></div>
</main>

<button class="music" id="music" type="button" aria-pressed="false">
  <span class="heart">♥</span>
  <span id="musicLabel">Play Music</span>
  <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
</button>

<div class="tools">
  <label class="tool">📷 Thêm ảnh<input id="photoIn" type="file" accept="image/*" multiple hidden></label>
  <label class="tool">🎵 Nhạc của bạn<input id="musicIn" type="file" accept="audio/*" hidden></label>
</div>

<section class="unlocked" id="unlocked" aria-live="polite">
  <div class="photos" id="photos" aria-hidden="true"></div>
  <div class="stage"><div id="three" aria-label="Bó hoa tulip đang xoay"></div><p class="tap">Chạm vào hoa nhé 🌷</p></div>
</section>

<div class="letter" id="letter" role="dialog" aria-label="Thiệp chúc 20/10" aria-hidden="true">
  <div class="letter-bg"></div>
  <div class="scene">
    <div class="env" id="env">
      <div class="env-back"></div>
      <div class="paper"></div>
      <div class="env-front"></div>
      <div class="flap"></div>
      <div class="seal">♥</div>
    </div>
    <div class="card-wrap" id="cardWrap">
      <article class="card3d" id="card3d">
        <span class="corner tl">✿</span><span class="corner tr">✿</span><span class="corner bl">✿</span><span class="corner br">✿</span>
        <span class="spark" style="top:8%;left:12%">✦</span><span class="spark" style="top:22%;right:9%;animation-delay:.8s">✦</span><span class="spark" style="bottom:30%;left:7%;animation-delay:1.4s">✦</span><span class="spark" style="bottom:12%;right:14%;animation-delay:.4s">✦</span>
        <h3 class="line" style="--d:.4s">20/10</h3>
        <div class="orn line" style="--d:.9s" aria-hidden="true">❦ ❦ ❦</div>
        <p class="line" style="--d:1.3s">Chúc em yêu Thanh Nguyệt 20/10 thật vui vẻ và hạnh phúc nhé.</p>
        <p class="line" style="--d:2.7s">Dù anh không ở cạnh, nhưng trái tim anh lúc nào cũng hướng về em.</p>
        <p class="sign line" style="--d:4.2s">Yêu em nhiều <i>❤️</i></p>
      </article>
    </div>
  </div>
  <button class="close" id="closeLetter" type="button">✕ Đóng thiệp</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Đổi mật khẩu tại đây
const PASSWORD = "2201";

const $ = id => document.getElementById(id);
const card = $('card'), dotsEl = $('dots').children, hint = $('hint');
let code = "", locked = false;

// Tiêu đề từng chữ nhún nhảy
$('title').innerHTML = [...'Nhập pass nha'].map((c,i)=>
  c===' ' ? ' ' : `<span style="animation-delay:${i*0.12}s" aria-hidden="true">${c}</span>`).join('');

// Bàn phím
const layout = ['1','2','3','4','5','6','7','8','9','','0','del'];
layout.forEach(k=>{
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'key' + (k==='del'?' del':'') + (k===''?' empty':'');
  b.textContent = k==='del' ? '✕' : k;
  if(k==='') b.tabIndex = -1;
  if(k==='del') b.setAttribute('aria-label','Xóa');
  b.addEventListener('pointerdown', e=>{ if(k) ripple(b,e); });
  b.addEventListener('click', ()=>{ if(k==='del') back(); else if(k) press(k); });
  $('pad').appendChild(b);
});
function ripple(el,e){
  const r = el.getBoundingClientRect(), s = document.createElement('span');
  const size = 40;
  s.className = 'ripple';
  s.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-r.left-size/2}px;top:${e.clientY-r.top-size/2}px`;
  el.appendChild(s); setTimeout(()=>s.remove(),600);
}
function render(){
  [...dotsEl].forEach((d,i)=>{
    const on = i < code.length;
    if(on && !d.classList.contains('on')){ d.classList.remove('on'); void d.offsetWidth; }
    d.classList.toggle('on', on);
  });
}
function press(n){
  if(locked || code.length>=4) return;
  code += n; render(); tone(520 + code.length*90, .12);
  const r = dotsEl[code.length-1].getBoundingClientRect();
  burst(r.left+r.width/2, r.top+r.height/2, 6);
  if(code.length===4) setTimeout(check, 260);
}
function back(){ if(locked) return; code = code.slice(0,-1); render(); tone(300,.08); }
function check(){
  if(code===PASSWORD){
    locked = true; hint.textContent = "Đúng rồi nè 💖"; hint.classList.remove('err');
    [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25),i*110));
    for(let i=0;i<8;i++) setTimeout(()=>burst(Math.random()*innerWidth, innerHeight*(.25+Math.random()*.5), 18),i*90);
    initBouquet(); setTimeout(()=>{ $('unlocked').classList.add('show'); startParty(); if(!musicOn) $('music').click(); },900);
  } else {
    hint.textContent = "Sai rồi, thử lại nha"; hint.classList.add('err');
    card.classList.add('shake'); tone(200,.3,'sawtooth');
    setTimeout(()=>{ card.classList.remove('shake'); code=""; render(); },500);
    setTimeout(()=>{ hint.textContent="Gõ 4 số để mở khóa"; hint.classList.remove('err'); },1800);
  }
}
// Bàn phím vật lý
addEventListener('keydown', e=>{
  if(/^\d$/.test(e.key)) press(e.key);
  else if(e.key==='Backspace') back();
});

// ===== Âm thanh (WebAudio, không cần file) =====
let ac, musicOn = false, musicTimer, step = 0;
function ctx(){ return ac || (ac = new (window.AudioContext||window.webkitAudioContext)()); }
function tone(freq, dur=.2, type='sine', vol=.08){
  try{
    const a = ctx(), o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, a.currentTime+dur);
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+dur);
  }catch(e){}
}
// Nhạc nền lãng mạn: hòa âm C - G - Am - F, arpeggio + bass + echo
let master, schedTimer, nextT = 0, beat = 0, customAudio = null;
function setupMaster(){
  if(master) return; const a = ctx();
  master = a.createGain(); master.gain.value = .9;
  const d = a.createDelay(); d.delayTime.value = .32;
  const fb = a.createGain(); fb.gain.value = .35;
  const wet = a.createGain(); wet.gain.value = .3;
  master.connect(a.destination); master.connect(d); d.connect(fb); fb.connect(d); d.connect(wet); wet.connect(a.destination);
}
function note(f,t,dur,type,vol){
  const a = ctx(), o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(master); o.start(t); o.stop(t+dur+.05);
}
const CH = [[261.63,329.63,392],[196,246.94,293.66],[220,261.63,329.63],[174.61,220,261.63]];
const BASS = [65.41,49,55,43.65];
const ARP = [0,1,2,1,2,1,2,1];
function schedule(){
  const a = ctx(), spb = .42;
  while(nextT < a.currentTime + .6){
    const bar = Math.floor(beat/8)%4, i = beat%8, ch = CH[bar];
    if(i===0){ ch.forEach(f=>note(f,nextT,spb*8,'sine',.035)); note(BASS[bar]*2,nextT,spb*4,'triangle',.07); }
    note(ch[ARP[i]]*2,nextT,spb*2.5,'triangle',.06);
    if(i===0||i===4) note(ch[(bar+i)%3]*4,nextT,spb*3,'sine',.03);
    nextT += spb; beat++;
  }
}
function startMusic(){
  if(customAudio){ customAudio.play().catch(()=>{}); return; }
  setupMaster(); nextT = ctx().currentTime + .1; beat = 0; schedule(); schedTimer = setInterval(schedule,150);
}
function stopMusic(){ clearInterval(schedTimer); if(customAudio) customAudio.pause(); }

const cv = $('fx'), g = cv.getContext('2d');
let W, H, parts = [];
function size(){ const d = devicePixelRatio||1; W = cv.width = innerWidth*d; H = cv.height = innerHeight*d; g.setTransform(d,0,0,d,0,0); }
addEventListener('resize', size); size();
const COLORS = ['#ff4d79','#ff8fab','#ffb3c6','#ffffff','#ff6b9a'];
function spawn(x,y,burstMode){
  parts.push({
    x, y,
    vx: burstMode ? (Math.random()-.5)*6 : (Math.random()-.5)*.4,
    vy: burstMode ? -Math.random()*5-1 : -Math.random()*.7-.25,
    r: burstMode ? Math.random()*7+5 : Math.random()*9+4,
    heart: burstMode ? true : Math.random()<.35,
    c: COLORS[Math.random()*COLORS.length|0],
    life: burstMode ? 1 : 2, decay: burstMode ? .016 : 0,
    ph: Math.random()*6.28, burst: burstMode
  });
}
function burst(x,y,n){ for(let i=0;i<n;i++) spawn(x,y,true); }
function heartPath(x,y,s){
  g.beginPath(); g.moveTo(x,y+s*.35);
  g.bezierCurveTo(x-s,y-s*.3,x-s*.5,y-s,x,y-s*.45);
  g.bezierCurveTo(x+s*.5,y-s,x+s,y-s*.3,x,y+s*.35); g.fill();
}
for(let i=0;i<28;i++) spawn(Math.random()*innerWidth, Math.random()*innerHeight, false);
setInterval(()=>{
  if(parts.length<70) spawn(Math.random()*innerWidth, innerHeight+20, false);
  if(party && parts.length<150){
    for(let i=0;i<2;i++){
      spawn(Math.random()*innerWidth, innerHeight+20, false);
      const p = parts[parts.length-1]; p.heart = true; p.r = 10+Math.random()*14; p.vy = -1.2-Math.random()*1.3;
    }
  }
}, 450);
function frame(t){
  g.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p=>{
    p.x += p.vx + (p.burst?0:Math.sin(t/900+p.ph)*.4);
    p.y += p.vy;
    if(p.burst){ p.vy += .12; p.life -= p.decay; }
    const alive = p.burst ? p.life>0 : (p.y > -30);
    if(!alive) return false;
    g.globalAlpha = p.burst ? Math.max(p.life,0) : .55;
    g.fillStyle = p.c;
    if(p.heart) heartPath(p.x,p.y,p.r);
    else { g.beginPath(); g.arc(p.x,p.y,p.r*.35,0,6.28); g.fill(); }
    return true;
  });
  g.globalAlpha = 1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const defaultPhotos = ['/z7194290429577_9fb84491b4c85b478e45dfc8146940b4.jpg','./2.jpg','/4.jpg','🧸','🍓','✨'].map((e,i)=>{

// ===== Bó hoa tulip 3D tự xoay =====
let bqReady=false;
function initBouquet(){
  if(bqReady||!window.THREE) return; bqReady=true;
  const T=THREE, host=$('three');
  const scene=new T.Scene();
  const cam=new T.PerspectiveCamera(32,1,.1,100);
  cam.position.set(0,1.4,13); cam.lookAt(0,.6,0);
  const rd=new T.WebGLRenderer({antialias:true,alpha:true});
  rd.setPixelRatio(Math.min(devicePixelRatio||1,2));
  host.appendChild(rd.domElement);
  scene.add(new T.HemisphereLight(0xffffff,0xffc2d1,.95));
  const dl=new T.DirectionalLight(0xffffff,.8); dl.position.set(4,7,6); scene.add(dl);
  const grp=new T.Group(); scene.add(grp);
  const std=(c,r=.55)=>new T.MeshStandardMaterial({color:c,roughness:r});
  const petalGeo=new T.SphereGeometry(1,16,12); petalGeo.scale(.34,.88,.22);
  const leafGeo=new T.SphereGeometry(1,12,8); leafGeo.scale(.12,.7,.03);
  const green=std(0x4f9a5a), dark=std(0x3b7d48);
  const pinks=[0xff8fb1,0xffa8c5,0xf4709b,0xffc2d6], whites=[0xffffff,0xfff5f8];
  const heads=[], N=11;
  for(let i=0;i<N;i++){
    const ang=i*2.399, rr=i===0?0:.35+.65*Math.sqrt(i/N), spread=rr*.42;
    const h=3.1+(1-rr)*.9+Math.random()*.3;
    const t=new T.Group(); t.position.y=-1.8;
    t.rotation.z=Math.sin(ang)*spread; t.rotation.x=Math.cos(ang)*spread;
    const mat=std(i%3===1?whites[i%2]:pinks[i%4],.45);
    const head=new T.Group(); head.position.y=h;
    for(let k=0;k<6;k++){
      const p=new T.Group(); p.rotation.y=k/6*Math.PI*2+Math.random()*.1;
      const m=new T.Mesh(petalGeo,mat); m.position.set(.3,.55,0); m.rotation.z=.22; p.add(m); head.add(p);
    }
    head.scale.setScalar(.85);
    const stem=new T.Mesh(new T.CylinderGeometry(.05,.05,h,8),green); stem.position.y=h/2;
    t.add(stem,head);
    if(i%2===0){ const lf=new T.Mesh(leafGeo,dark); lf.position.set(.22,h*.55,0); lf.rotation.z=-.6; lf.rotation.y=Math.random()*6; t.add(lf); }
    grp.add(t); heads.push(head);
  }
  const bl=[0xffffff,0xffd6e2,0xffb3c9], yel=std(0xffe27a), tiny=new T.SphereGeometry(.09,8,6);
  for(let i=0;i<16;i++){
    const a=Math.random()*6.28, r=.5+Math.random()*.8, y=1+Math.random()*1.5;
    const c=new T.Group(); c.position.set(Math.cos(a)*r,y,Math.sin(a)*r);
    const pm=std(bl[i%3],.6);
    for(let k=0;k<5;k++){ const m=new T.Mesh(tiny,pm), b=k/5*6.28; m.position.set(Math.cos(b)*.11,Math.sin(b)*.11,0); c.add(m); }
    c.add(new T.Mesh(tiny,yel)); c.lookAt(c.position.x*3,c.position.y,c.position.z*3);
    grp.add(c);
  }
  const wrap=new T.Mesh(new T.CylinderGeometry(1,.42,2.3,24,1,true),new T.MeshStandardMaterial({color:0xffffff,roughness:.7,side:T.DoubleSide}));
  wrap.position.y=-1.15; grp.add(wrap);
  for(let k=0;k<5;k++){ const s=new T.Mesh(new T.CylinderGeometry(.06,.06,.5,6),dark); s.position.set((k-2)*.07,-2.45,0); grp.add(s); }

  let pulse=0, vel=.55, drag=false, lastX=0, sx=0, sy=0;
  const el=rd.domElement;
  el.addEventListener('pointerdown',e=>{
    drag=true; lastX=e.clientX; sx=e.clientX; sy=e.clientY; pulse=1; vel=2.4;
    burst(e.clientX,e.clientY,14);
    [784,988,1175].forEach((f,i)=>setTimeout(()=>tone(f,.4,'triangle'),i*90));
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
  });
  el.addEventListener('pointermove',e=>{ if(drag){ grp.rotation.y+=(e.clientX-lastX)*.01; lastX=e.clientX; } });
  const up=e=>{ drag=false; if(e&&e.type==='pointerup'&&Math.hypot(e.clientX-sx,e.clientY-sy)<8) openLetter(); };
  el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
  function fit(){ const w=host.clientWidth,h=host.clientHeight; if(!w||!h) return; rd.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix(); }
  addEventListener('resize',fit); fit();
  const clk=new T.Clock();
  (function loop(){
    const dt=Math.min(clk.getDelta(),.05), t=clk.elapsedTime;
    if(!drag){ vel+=(.55-vel)*dt*1.5; grp.rotation.y+=vel*dt; }
    pulse=Math.max(0,pulse-dt*1.4);
    const s=.85*(1+.28*Math.sin(pulse*Math.PI));
    heads.forEach((h,i)=>{ h.scale.setScalar(s); h.rotation.y=Math.sin(t*1.2+i)*.08; });
    grp.position.y=Math.sin(t*1.5)*.08;
    rd.render(scene,cam); requestAnimationFrame(loop);
  })();
}
